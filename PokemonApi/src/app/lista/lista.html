<button type="button" (click)="RequestType()">Mostra tipi pokemon</button>

@if (loading){
    <div>loading...</div>
}
<div>
    @if (data != null && data.results){
    @for (pokemon of data.results.slice(0,3); track pokemon.name){
    <a [routerLink]="['/nomi-pokemon', pokemon.name]" style="text-decoration: none; color: inherit; display: block;">{{pokemon.name}}</a>
    }
}
</div>
